laceholder="اكتب اسمك"></div><div><label>الصفة / الدور</label><input id="role" type="text" placeholder="مثال: عضو البرلمان"></div></div><button class="primary" id="make">إنشاء صورتي</button><button class="secondary hidden" id="download">حفظ الصورة على الهاتف</button><p class="note">التصميم يُجهَّز على جهازك مباشرة ولا يحتاج إلى تسجيل دخول.</p><div class="preview"><canvas id="canvas" width="1080" height="1350"></canvas></div></div></div><script>const q=id=>document.getElementById(id),c=q('canvas'),x=c.getContext('2d');let im=null;function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}function t(s,a,b,z,w='700',co='#fff'){x.fillStyle=co;x.font=`${w} ${z}px Tahoma,Arial,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(s,a,b)}function cover(i,a,b,w,h){let s=Math.max(w/i.width,h/i.height),nw=i.width*s,nh=i.height*s;x.drawImage(i,a+(w-nw)/2,b+(h-nh)/2,nw,nh)}function wheel(cx,cy,r){x.save();x.strokeStyle='#d5ad49';x.lineWidth=12;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();x.lineWidth=6;for(let i=0;i<12;i++){let a=i*Math.PI/6;x.beginPath();x.moveTo(cx+Math.cos(a)*18,cy+Math.sin(a)*18);x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);x.stroke()}x.fillStyle='#0d3b2b';x.beginPath();x.arc(cx,cy,22,0,Math.PI*2);x.fill();x.restore()}function draw(){let W=c.width,H=c.height,g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071b13');g.addColorStop(.58,'#174b35');g.addColorStop(1,'#06150f');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.1;x.fillStyle='#fff';x.fillRect(0,0,W,22);x.fillStyle='#c99c32';x.fillRect(0,22,W,22);x.fillStyle='#b83232';x.fillRect(0,44,W,22);x.globalAlpha=1;x.strokeStyle='#d5ad4929';x.lineWidth=3;for(let i=0;i<18;i++){x.beginPath();x.moveTo(W/2,160);x.lineTo(70+i*55,30);x.stroke()}t('برلمان شباب الفيوم',W/2,88,48,'800','#f2cf72');t('مديرية الشباب والرياضة – محافظة الفيوم',W/2,140,25);t('محاكاة مجلس النواب ٢٠٢٦',W/2,184,29,'800','#f2cf72');x.strokeStyle='#d5ad49';x.lineWidth=3;x.beginPath();x.moveTo(90,220);x.lineTo(W-90,220);x.stroke();t('الذكرى الـ٥٣ لانتصارات أكتوبر',W/2,260,28,'800');let px=120,py=310,pw=840,ph=700;x.save();rr(px,py,pw,ph,36);x.clip();if(im)cover(im,px,py,pw,ph);else{x.fillStyle='#d9dedb';x.fillRect(px,py,pw,ph);t('ارفع صورتك الشخصية',W/2,640,36,'800','#234637')}x.restore();x.strokeStyle='#e4c866';x.lineWidth=12;rr(px,py,pw,ph,36);x.stroke();x.fillStyle='#04160ff0';rr(90,1045,900,210,32);x.fill();x.strokeStyle='#d5ad49';x.lineWidth=4;rr(90,1045,900,210,32);x.stroke();t(q('name').value.trim()||'الاسم',W/2,1105,42,'800','#f2cf72');t(q('role').value.trim()||'الصفة / الدور',W/2,1160,28);t('محاكاة مجلس النواب ٢٠٢٦ • محافظة الفيوم',W/2,1213,22,'600','#d7e2dc');wheel(135,125,52);wheel(W-135,125,52);t('٦ أكتوبر ١٩٧٣',W/2,1295,24,'800','#f2cf72')}q('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=v=>{im=new Image;im.onload=draw;im.src=v.target.result};r.readAsDataURL(f)};q('name').oninput=draw;q('role').oninput=draw;q('make').onclick=()=>{draw();q('download').classList.remove('hidden');c.scrollIntoView({behavior:'smooth',block:'center'})};q('download').onclick=()=>{let a=document.createElement('a');a.download='برلمان-شباب-الفيوم-محاكاة-مجلس-النواب-2026.png';a.href=c.toDataURL('image/png');a.click()};draw();</script></body></html>
